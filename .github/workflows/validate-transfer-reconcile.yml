name: XamePay Transfer Reconciliation Validation

on:
  push:
    branches:
      - validate-xamepay-transfer-reconcile

permissions:
  contents: read

concurrency:
  group: xamepay-transfer-reconciliation-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Dart source
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyse Dart source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
