name: XamePay Flutter Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Flutter dependencies and Dart source
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyse Dart source
        run: flutter analyze

  android-build:
    name: Android build
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffold
        run: |
          flutter create \
            --platforms=android \
            --org com.xamepay \
            --project-name app \
            .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xamepay-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  ios-build:
    name: iOS build
    runs-on: macos-latest
    needs: validate

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS platform scaffold
        run: |
          flutter create \
            --platforms=ios \
            --org com.xamepay \
            --project-name app \
            .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign
