name: XamePay Android APK Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '!v*-ios'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.10'

jobs:
  validate:
    name: Validate Flutter dependencies and Dart source
    if: ${{ !endsWith(github.ref, '-ios') }}
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyse Dart source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  android-build:
    name: Build Android APK
    if: ${{ !endsWith(github.ref, '-ios') }}
    runs-on: ubuntu-24.04
    needs: validate

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate Android platform scaffold
        run: |
          flutter create \
            --platforms=android \
            --org com.xamepay \
            --project-name app \
            .

      - name: Set XamePay app name
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          m = manifest.read_text()
          if len(re.findall(r'android:label="[^"]*"', m)) != 1:
              raise SystemExit("Expected exactly one android:label; refusing to guess.")
          m = re.sub(r'android:label="[^"]*"', 'android:label="XamePay"', m)
          manifest.write_text(m)
          print("Set android:label to XamePay")
          PY

      - name: Install XamePay launcher icons
        shell: bash
        run: |
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow
          python3 <<'PY'
          from pathlib import Path
          from PIL import Image

          logo = Image.open("assets/images/xamepay_logo.png").convert("RGBA")
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          res = Path("android/app/src/main/res")
          for density, px in sizes.items():
              folder = res / f"mipmap-{density}"
              if not folder.is_dir():
                  raise SystemExit(f"{folder} not found; refusing to guess.")
              logo.resize((px, px), Image.LANCZOS).save(folder / "ic_launcher.png")
              print(f"wrote {folder / 'ic_launcher.png'}")
          PY

      - name: Enable core library desugaring
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle = next((p for p in candidates if p.is_file()), None)
          if gradle is None:
              raise SystemExit("Android app Gradle file was not generated.")

          text = gradle.read_text()
          is_kts = gradle.suffix == ".kts"

          marker = "isCoreLibraryDesugaringEnabled = true" if is_kts else "coreLibraryDesugaringEnabled true"
          if marker not in text:
              pattern = r"compileOptions\s*\{"
              match = re.search(pattern, text)
              if not match:
                  raise SystemExit("Could not find compileOptions block; refusing to guess.")
              start = match.end()
              depth = 1
              i = start
              while i < len(text) and depth:
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                  i += 1
              if depth:
                  raise SystemExit("Unclosed compileOptions block.")
              block = text[match.start():i]
              addition = (
                  "\n        isCoreLibraryDesugaringEnabled = true\n"
                  if is_kts else
                  "\n        coreLibraryDesugaringEnabled true\n"
              )
              text = text[:i - 1] + addition + text[i - 1:]

          dependency = (
              'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
              if is_kts else
              "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
          )
          if dependency not in text:
              match = re.search(r"dependencies\s*\{", text)
              if not match:
                  text += "\ndependencies {\n}\n"
                  match = re.search(r"dependencies\s*\{", text)
              start = match.end()
              depth = 1
              i = start
              while i < len(text) and depth:
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                  i += 1
              if depth:
                  raise SystemExit("Unclosed dependencies block.")
              text = text[:i - 1] + "\n    " + dependency + "\n" + text[i - 1:]

          gradle.write_text(text)
          print(f"Enabled core library desugaring in {gradle}")
          PY

      - name: Verify Android Gradle configuration
        run: |
          grep -n -A8 -B2 'compileOptions' android/app/build.gradle*
          grep -n 'desugar_jdk_libs' android/app/build.gradle*

      - name: Resolve dependencies
        run: flutter pub get

      - name: Extract version from pubspec
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          echo "name=$(echo $VERSION | cut -d'+' -f1)" >> $GITHUB_OUTPUT
          echo "build=$(echo $VERSION | cut -d'+' -f2)" >> $GITHUB_OUTPUT

      - name: Add INTERNET permission and release signing
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          m = manifest.read_text()
          perm = '<uses-permission android:name="android.permission.INTERNET"/>'
          if perm not in m:
              if m.count("<application") != 1:
                  raise SystemExit("Could not find a single <application> tag; refusing to guess.")
              m = m.replace("<application", perm + "\n    <application", 1)
              manifest.write_text(m)
              print("Added INTERNET permission")

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle = next((p for p in candidates if p.is_file()), None)
          if gradle is None:
              raise SystemExit("Android app Gradle file was not generated.")
          text = gradle.read_text()
          is_kts = gradle.suffix == ".kts"

          if "keyPropsFile" not in text:
              if is_kts:
                  old_sign = 'signingConfig = signingConfigs.getByName("debug")'
                  new_sign = 'signingConfig = signingConfigs.getByName("release")'
                  block = "\n".join([
                      'signingConfigs {',
                      '        create("release") {',
                      '            val keyProps = Properties()',
                      '            val keyPropsFile = rootProject.file("key.properties")',
                      '            if (keyPropsFile.exists()) {',
                      '                keyProps.load(FileInputStream(keyPropsFile))',
                      '                keyAlias = keyProps["keyAlias"] as String',
                      '                keyPassword = keyProps["keyPassword"] as String',
                      '                storeFile = file(keyProps["storeFile"] as String)',
                      '                storePassword = keyProps["storePassword"] as String',
                      '            }',
                      '        }',
                      '    }',
                      '',
                      '    buildTypes {',
                  ])
              else:
                  old_sign = "signingConfig signingConfigs.debug"
                  new_sign = "signingConfig signingConfigs.release"
                  block = "\n".join([
                      'signingConfigs {',
                      '        release {',
                      '            def keyProps = new Properties()',
                      "            def keyPropsFile = rootProject.file('key.properties')",
                      '            if (keyPropsFile.exists()) {',
                      '                keyProps.load(new FileInputStream(keyPropsFile))',
                      "                keyAlias keyProps['keyAlias']",
                      "                keyPassword keyProps['keyPassword']",
                      "                storeFile file(keyProps['storeFile'])",
                      "                storePassword keyProps['storePassword']",
                      '            }',
                      '        }',
                      '    }',
                      '',
                      '    buildTypes {',
                  ])
              for old, new in ((old_sign, new_sign), ("buildTypes {", block)):
                  if text.count(old) != 1:
                      raise SystemExit(f"Expected one match for {old!r}; refusing to guess.")
                  text = text.replace(old, new)
              if is_kts:
                  text = "import java.io.FileInputStream\nimport java.util.Properties\n\n" + text
              gradle.write_text(text)
              print(f"Enabled release signing in {gradle}")
          PY

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks
          ls -la android/app/release.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties << KEYEOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.jks
          KEYEOF

      - name: Build release APK
        run: |
          flutter build apk \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info

      - name: Build release AAB (Play Store)
        run: |
          find build/app/outputs/flutter-apk -name "*.apk" ! -name "app-release.apk" -delete 2>/dev/null || true
          flutter build appbundle \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info

      - name: Rename APK and AAB
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/XamePay_v${{ steps.version.outputs.name }}_build${{ steps.version.outputs.build }}.apk
          mv build/app/outputs/bundle/release/app-release.aab \
            build/app/outputs/bundle/release/XamePay_v${{ steps.version.outputs.name }}_build${{ steps.version.outputs.build }}.aab

      - uses: actions/upload-artifact@v4
        with:
          name: XamePay-v${{ steps.version.outputs.name }}-build${{ steps.version.outputs.build }}
          path: build/app/outputs/flutter-apk/XamePay_*.apk
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: XamePay-AAB-v${{ steps.version.outputs.name }}-build${{ steps.version.outputs.build }}
          path: build/app/outputs/bundle/release/XamePay_*.aab
          retention-days: 1

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-build${{ steps.version.outputs.build }}
          name: XamePay v${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.build }})
          files: |
            build/app/outputs/flutter-apk/XamePay_*.apk
            build/app/outputs/bundle/release/XamePay_*.aab
          generate_release_notes: false

      - name: Cleanup
        if: always()
        run: rm -f android/app/release.jks android/key.properties
