publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  dio: ^5.7.0
  http: ^1.2.2
  socket_io_client: ^2.0.3+1
  package_info_plus: ^8.0.2
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  share_plus: ^10.0.2
  screenshot: ^3.0.0
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  pdf: ^3.11.1
  flutter_local_notifications: ^17.2.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
